name: Maven Install
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MAVEN_OPTS: "-Duser.language=en -Duser.region=US" 
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
    - run: mvn --version
    - run: mvn -B -U install
